# check (typecheck, test, build, e2e) -> images (web, api, worker) -> deploy to t4a, see infra/README.md.
# Pull requests into development and main run check only; pushes to main deploy.
# Rollback: run by hand with `tag` = an older sha; that skips check and images.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy this existing image tag (git sha) instead of building"
        required: false

env:
  IMAGE_PREFIX: ghcr.io/etiam-si/jakamarinko
  SITE_URL: https://jakamarinko.com

jobs:
  check:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    # e2e starts the api, and /api/health needs a database.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54320:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54320/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @jakamarinko/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  images:
    if: ${{ github.event_name != 'pull_request' && !inputs.tag }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, api, worker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  deploy:
    if: ${{ github.event_name != 'pull_request' && !cancelled() && !failure() }}
    needs: images
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Two merges close together: the older run can get the deploy slot last and roll main back.
      # So a push deploys only if it is still the newest main (a manual `tag` rollback always deploys).
      - name: Still the newest main?
        id: newest
        if: ${{ !inputs.tag }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head now, skipping the deploy of $GITHUB_SHA"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH key
        if: steps.newest.outputs.stale != 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Copy compose.yml
        if: steps.newest.outputs.stale != 'true'
        run: scp infra/compose.yml deploy@${{ secrets.DEPLOY_HOST }}:/srv/jakamarinko/
      # The job's own token logs in for the pull (works while the GHCR packages are private), in a
      # docker config of its own so the expired token never breaks other apps' pulls on the server.
      - name: Pull and restart
        if: steps.newest.outputs.stale != 'true'
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "cd /srv/jakamarinko && export IMAGE_TAG=$TAG DOCKER_CONFIG=/srv/jakamarinko/.docker \
            && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && docker compose pull && docker compose up -d --remove-orphans; rc=\$?; docker logout ghcr.io; docker image prune -af; exit \$rc"
      - name: Wait for the site and /api/health
        if: steps.newest.outputs.stale != 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "$SITE_URL/api/health" && curl -fsS --max-time 5 -o /dev/null "$SITE_URL/"; then exit 0; fi
            sleep 2
          done
          echo "$SITE_URL did not come up within 60 s"
          exit 1
